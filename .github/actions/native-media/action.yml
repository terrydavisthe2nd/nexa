name: Native media toolchain
description: Install native screen and application-audio capture prerequisites
runs:
  using: composite
  steps:
    - name: Select the macOS native media SDK
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        # The pinned ScreenCaptureKit bridge also compiles availability-guarded
        # Metal 26 declarations, so it needs SDK 26 even when targeting macOS 13.
        xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
        test -n "$xcode"
        sudo xcode-select --switch "$xcode/Contents/Developer"
        xcodebuild -version

    - name: Install Linux native media dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
        sudo apt-get update
        sudo apt-get install -y clang-21 libpulse-dev libva-dev libgbm-dev libdrm-dev \
          libxrandr-dev libxdamage-dev libxfixes-dev libxcomposite-dev libasound2-dev
        echo 'CC=clang-21' >> "$GITHUB_ENV"
        echo 'CXX=clang++-21' >> "$GITHUB_ENV"
