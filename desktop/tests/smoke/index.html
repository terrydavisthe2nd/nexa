<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nexa desktop smoke test</title>
    <style>
      body { background: #111; color: #eee; font: 16px monospace; padding: 24px; }
    </style>
  </head>
  <body>
    <h1>Nexa desktop smoke test</h1>
    <pre id="out">waiting for the bridge…</pre>
    <script>
      (async () => {
        const report = { bridge: false, errors: [], stage: "start" };
        const out = [];
        const post = async (stage) => {
          report.stage = stage;
          try {
            await fetch("/report", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(report),
            });
          } catch (error) {
            document.title = "report failed at " + stage;
          }
        };
        try {
          for (let i = 0; i < 150 && !window.evilionDesktop; i++) {
            await new Promise((r) => setTimeout(r, 100));
          }
          const b = window.evilionDesktop;
          report.bridge = !!b;
          await post("bridge");
          if (b) {
            report.version = b.version;
            report.platform = b.platform;
            report.settings = await b.settings.get();
            await post("settings-get");
            await b.settings.set({
              launchAtLogin: false,
              startMinimized: false,
              closeToTray: true,
              hardwareAcceleration: true,
            });
            report.settingsAfter = await b.settings.get();
            await post("settings-set");
            report.partialSettings = await b.settings.set({ closeToTray: false });
            report.settingsAfterPartial = await b.settings.get();
            await b.settings.set({ closeToTray: true });
            await post("settings-partial");
            report.screenAccess = await b.screenAccess();
            report.media = {
              secure: window.isSecureContext,
              mediaDevices: typeof navigator.mediaDevices,
              getDisplayMedia: typeof navigator.mediaDevices?.getDisplayMedia,
              getUserMedia: typeof navigator.mediaDevices?.getUserMedia,
              mediaRecorder: typeof window.MediaRecorder,
              audioContext: typeof window.AudioContext,
              worklet: typeof AudioWorkletNode,
              locks: typeof navigator.locks,
              userAgent: navigator.userAgent,
              shareAudio: b.shareAudio,
              shareAudioMode: b.shareAudioMode,
              captureScreen: typeof b.captureScreen,
              stopScreen: typeof b.stopScreen,
              peerConnection: typeof RTCPeerConnection,
              supportedConstraints: navigator.mediaDevices?.getSupportedConstraints(),
            };
            await post("screen-access");
            report.window = await b.getWindowState();
            await post("window-state");
            report.update = await b.updates.getState();
            await post("update-state");
            const waitFor = async (label, read, accept) => {
              const deadline = Date.now() + 15000;
              let value;
              do {
                value = await read();
                if (accept(value)) return value;
                await new Promise((r) => setTimeout(r, 50));
              } while (Date.now() < deadline);
              throw new Error(label + " timed out: " + JSON.stringify(value));
            };
            const listening = (state) => state.enabled && state.listening.ipc && state.listening.ws;
            report.rpc = await waitFor("RPC startup", () => b.rpc.getState(), listening);
            await post("rpc-state");
            // The Python runner owns real external clients and keeps them connected
            // while this page checks both the bridge state and delivered events.
            const activityEvents = [];
            const stopActivities = b.onActivities((list) => activityEvents.push(list));
            await b.rpc.setRelay(false); // CI needs no installed or signed-in Discord.
            await b.setIdentity({ id: "345678901234567890", username: "smoke-rpc", global_name: "Smoke RPC" });
            await b.rpc.setHidden("0", false); // Empty-list event is a subscription barrier.
            await waitFor("activity listener", async () => activityEvents.length, (n) => n > 0);
            report.rpcIntegration = {};
            const probe = async (stage) => {
              report.rpcEndpoint = await b.rpc.getState();
              await post(stage);
              return waitFor(stage, async () => (await fetch("/rpc-probe")).json(),
                (result) => result.stage === stage);
            };
            const ipcId = "123456789012345678", wsId = "234567890123456789";
            const matches = (activity, id) => activity?.application_id === id && activity.type === 0 &&
              activity.name === (id === ipcId ? "IPC Smoke Atlas" : "WebSocket Smoke Beacon") &&
              activity.details === (id === ipcId ? "Exploring north" : "Building south") &&
              activity.state === (id === ipcId ? "Party of 2" : "Room of 7");
            const observe = async (label, ids, cleared = false) => {
              const state = await waitFor(label + " state", () => b.rpc.getState(), (state) =>
                state.apps.length === ids.length && ids.every((id) => {
                  const app = state.apps.find((app) => app.clientId === id);
                  return app && (cleared && id === ipcId ? app.activity === null : matches(app.activity, id));
                }));
              const visible = ids.filter((id) => !(cleared && id === ipcId));
              const events = await waitFor(label + " event", async () => activityEvents.at(-1), (list) =>
                Array.isArray(list) && list.length === visible.length &&
                visible.every((id) => list.some((activity) => matches(activity, id))));
              return { state, activities: events };
            };
            const published = async (stage, key) => {
              activityEvents.length = 0;
              const wire = await probe(stage);
              report.rpcIntegration[key] = { wire, ...await observe(key, [ipcId, wsId]) };
            };
            await published("rpc-publish", "published");
            activityEvents.length = 0;
            const clearWire = await probe("rpc-clear");
            report.rpcIntegration.cleared = { wire: clearWire, ...await observe("clear", [ipcId, wsId], true) };
            activityEvents.length = 0;
            await probe("rpc-disconnect");
            report.rpcIntegration.disconnected = await observe("disconnect", []);
            await published("rpc-republish", "beforeDisable");
            await b.rpc.setEnabled(false);
            report.rpcIntegration.disabled = await waitFor("RPC disable", () => b.rpc.getState(), (state) =>
              !state.enabled && !state.listening.ipc && !state.listening.ws && state.apps.length === 0);
            await b.rpc.setEnabled(true);
            report.rpcIntegration.reenabled = await waitFor("RPC re-enable", () => b.rpc.getState(), listening);
            await published("rpc-reconnect", "afterEnable");
            activityEvents.length = 0;
            await probe("rpc-finish");
            report.rpcIntegration.finished = await observe("final disconnect", []);
            stopActivities();
            await b.setIdentity(null);
            await b.rpc.setRelay(report.rpc.relay);
            await post("rpc-tested");
            report.versions = b.versions;
            await b.setStrings({
              open: "Open", mute: "Mute", deafen: "Deafen",
              checkForUpdates: "Check for Updates", quit: "Quit",
              view: "View", reload: "Reload", addToDictionary: "Add to Dictionary",
              copyLink: "Copy Link", openLinkInBrowser: "Open Link in Browser",
              offlineTitle: "No Connection", offlineBody: "Offline",
              offlineRetry: "Retry", about: "About Nexa",
            });
            await post("strings");
            report.shortcuts = await b.setShortcuts([
              { action: "mute", accelerator: "CommandOrControl+Shift+M" },
            ]);
            await post("shortcuts");
            report.badge = await b.setBadge(3);
            await post("badge");
            report.callActive = await b.setCallActive(true);
            await new Promise((r) => setTimeout(r, 300));
            report.windowInCall = await b.getWindowState();
            if (new URLSearchParams(location.search).has("window-test")) {
              const window = __TAURI__.window.getCurrentWindow();
              report.positionBefore = await window.outerPosition();
              await post("close-in-call");
              await new Promise((r) => setTimeout(r, 1500));
              report.closedInCall = await b.getWindowState();
              await b.focusWindow();
              await new Promise((r) => setTimeout(r, 300));
              report.reopenedInCall = await b.getWindowState();
              report.positionAfterClose = await window.outerPosition();
              await b.setCallActive(false);
              await post("hide-before-call");
              await new Promise((r) => setTimeout(r, 500));
              await b.setCallActive(true);
              await new Promise((r) => setTimeout(r, 300));
              report.hiddenInCall = await b.getWindowState();
              await b.focusWindow();
              await new Promise((r) => setTimeout(r, 300));
              report.positionAfterHidden = await window.outerPosition();
            }
            await b.setCallActive(false);
            await post("call-mode");
            out.push("bridge ok", "version " + report.version);
          }
        } catch (error) {
          report.errors.push(String(error && error.stack ? error.stack : error));
        }
        document.getElementById("out").textContent =
          out.join("\n") + "\n" + JSON.stringify(report, null, 2);
        await post("done");
      })();
    </script>
  </body>
</html>
