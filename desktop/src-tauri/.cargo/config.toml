# The pinned libwebrtc SDK uses the static MSVC runtime.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Keep libwebrtc's Objective-C categories from being stripped at link time.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]
rustdocflags = ["-C", "link-arg=-ObjC"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]
rustdocflags = ["-C", "link-arg=-ObjC"]
